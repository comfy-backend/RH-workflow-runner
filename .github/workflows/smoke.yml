name: Runner smoke test

# Connectivity self-test for the public compute runner — validates everything
# the production workflow depends on, WITHOUT running the pipeline:
#   1. PAT can check out the PRIVATE code repo
#   2. PAT can clone the PRIVATE data repo (auth only — no LFS download)
#   3. All required secrets are present (values never printed)
#   4. The GitLab credential authenticates
#   5. The alert path works: GH_PAT can post a comment to the private repo
#
# Fires on every push to this repo (so workflow-file changes are verified
# before they can break the daily schedule) and on manual dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Connectivity smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code repo (private, via PAT)
        uses: actions/checkout@v4
        with:
          repository: beulahkemp/RH-workflow
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Verify code checkout
        run: |
          test -f rh_catalog/cli.py || { echo "FATAL: code checkout incomplete"; exit 1; }
          echo "Code repo OK at $(git rev-parse HEAD)"

      - name: Clone data repo (auth check, no LFS pull)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "FATAL: GH_PAT secret not set"; exit 1
          fi
          rm -rf /tmp/rh-data-smoke
          # Smudge OFF: the LFS budget block (issue #18) rejects READS too
          # since 2026-09-25 — a smudged checkout dies with exit 128 (this
          # exact crash broke the smoke on Sep 25+ pushes). The pointer
          # stubs prove clone+tree access, which is all this step tests.
          export GIT_LFS_SKIP_SMUDGE=1
          git clone --depth 1 "https://beulahkemp:${GH_PAT}@github.com/beulahkemp/RH-workflow-data.git" /tmp/rh-data-smoke
          # T1 M3 (2026-09-29): the catalog.db.gz pointer is RETIRED from
          # the tree (out-of-band cutover dc52ed3) — the HARD assertion is
          # now the shard carrier (round-3 audit R3-B F1: the old pointer
          # check became silently-false-forever, swallowed by &&; a soft
          # note is not a smoke test).
          test -f /tmp/rh-data-smoke/shards/MANIFEST.json || \
            { echo "FATAL: shards/MANIFEST.json missing from the data repo HEAD"; exit 1; }
          echo "Shard carrier present: $(python3 -c "import json;m=json.load(open('/tmp/rh-data-smoke/shards/MANIFEST.json'));print(m.get('format','?'), 'v'+str(m.get('version','?')))")"
          echo "Data repo clone OK"
          git -C /tmp/rh-data-smoke log --oneline -1
          rm -rf /tmp/rh-data-smoke

      - name: Verify secrets are present
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_DB_TOKEN: ${{ secrets.TURSO_DB_TOKEN }}
          NETLIFY_PAT: ${{ secrets.NETLIFY_PAT }}
          NETLIFY_BLOB_SITE_ID: ${{ secrets.NETLIFY_BLOB_SITE_ID }}
        run: |
          # Presence check only — values are never echoed (and would be
          # auto-redacted anyway).
          missing=0
          for v in GH_PAT GITLAB_PAT TURSO_DB_URL TURSO_DB_TOKEN NETLIFY_PAT NETLIFY_BLOB_SITE_ID; do
            if [ -z "${!v}" ]; then echo "FATAL: secret $v is not set"; missing=1; fi
          done
          [ "$missing" = "0" ] && echo "All 6 secrets present"

      - name: Netlify blob backup round-trip (T6 canary)
        env:
          NETLIFY_PAT: ${{ secrets.NETLIFY_PAT }}
          NETLIFY_BLOB_SITE_ID: ${{ secrets.NETLIFY_BLOB_SITE_ID }}
        run: |
          # T6 (2026-09-29): the third-copy arm's LIVE canary. A tiny
          # synthetic repo goes through the REAL production path —
          # blobs-sync (bootstrap + one incremental edge) then
          # blobs-restore — against the ISOLATED smoke store
          # (site:rh-backup-smoke, never the production store). If the
          # backup arm breaks (API drift, auth death, a code regression),
          # smoke goes red on the next runner push — that is the point.
          set -e
          python3 -m pip install -q httpx
          rm -rf /tmp/rh-blob-smoke && mkdir -p /tmp/rh-blob-smoke
          cd /tmp/rh-blob-smoke
          git init -q -b main tiny
          git -C tiny config user.name t && git -C tiny config user.email t@t
          echo one > tiny/a.txt && git -C tiny add -A && git -C tiny commit -qm c1
          export NETLIFY_PAT NETLIFY_BLOB_SITE_ID
          # bootstrap (tiny repo is non-shallow -> the real bootstrap path)
          python3 -m rh_catalog.cli blobs-sync --data-repo /tmp/rh-blob-smoke/tiny --store site:rh-backup-smoke
          echo two > tiny/b.txt && git -C tiny add -A && git -C tiny commit -qm c2
          # incremental edge
          python3 -m rh_catalog.cli blobs-sync --data-repo /tmp/rh-blob-smoke/tiny --store site:rh-backup-smoke
          # restore + assert exact history
          python3 -m rh_catalog.cli blobs-restore --out /tmp/rh-blob-smoke/restored --store site:rh-backup-smoke
          test "$(git -C /tmp/rh-blob-smoke/tiny rev-parse HEAD)" = "$(git -C /tmp/rh-blob-smoke/restored rev-parse HEAD)" \
            || { echo "FATAL: blob round-trip head mismatch"; exit 1; }
          test "$(cat /tmp/rh-blob-smoke/restored/b.txt)" = "two" \
            || { echo "FATAL: blob round-trip content mismatch"; exit 1; }
          echo "Netlify blob round-trip OK (bootstrap + edge + restore verified)"

      - name: Verify GitLab credential
        env:
          GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
        run: |
          # Single polite API call; WAF 403s are retried by the production
          # push step, not here — this is an auth sanity check.
          code=$(curl -s -o /tmp/gl_user.json -w "%{http_code}" \
            -H "PRIVATE-TOKEN: ${GITLAB_PAT}" "https://gitlab.com/api/v4/user")
          if [ "$code" = "200" ]; then
            echo "GitLab auth OK (user: $(python3 -c "import json;print(json.load(open('/tmp/gl_user.json'))['username'])"))"
          elif [ "$code" = "403" ]; then
            echo "::warning::GitLab returned 403 (known WAF flakiness — auth not confirmed, not fatal)"
          else
            echo "FATAL: GitLab auth failed with HTTP $code"
            exit 1
          fi

      - name: Verify alert path (comment on private repo)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            // Mirrors the production alert step's auth path (cross-repo issue
            // writes via PAT). Posts a one-line status comment on the billing
            // tracking issue (#13) so the auth proof doubles as an audit trail.
            await github.rest.issues.createComment({
              owner: 'beulahkemp',
              repo: 'RH-workflow',
              issue_number: 13,
              body: `Runner smoke test passed from the new org: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            core.info('Alert path verified (comment posted to issue #13).');

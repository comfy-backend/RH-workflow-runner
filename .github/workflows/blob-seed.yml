name: Blob backup seed (T6)

# T6 (2026-09-29): one-time (or recovery) SEED of the Netlify blob store —
# the full-history bundle (~3.3 GB) the daily chain extends from. Dispatch
# manually; NEVER runs on a schedule. The daily Phase 8.5 step refuses to
# bootstrap from its shallow clone by design (a shallow seed is uncloneable
# — round4-t6-design-review T6) — THIS workflow carries a FULL clone.
#
# Re-seed (inputs.reseed=true): new seed key -> manifest swap -> GC of the
# superseded keys (crash-safe order; never overwrites the live seed). Use
# after a chain wedge the supersede-tail repair could not heal, or to reset
# store bloat.

on:
  workflow_dispatch:
    inputs:
      reseed:
        description: "Force a fresh seed + chain reset (swaps + GCs; nothing is overwritten in place)"
        type: boolean
        default: false

concurrency:
  # F4 (round4-t6-design-review): blob PUTs are last-write-wins with no CAS —
  # the seed must NEVER race the daily refresh (or another seed).
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  seed:
    name: Seed the Netlify blob store
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out code repo (private, via PAT)
        uses: actions/checkout@v4
        with:
          repository: beulahkemp/RH-workflow
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: python3 -m pip install -q httpx

      - name: Free runner disk space
        run: |
          # Mirror the refresh workflow's step: the full data-repo clone
          # (checkout ~6.3 GB + .git ~3.3 GB) + the ~3.3 GB seed bundle
          # need the headroom.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup \
            /opt/ghc /usr/local/swift 2>/dev/null || true
          df -h / | tail -1

      - name: Configure Git
        run: |
          git config --global user.name "beulahkemp"
          git config --global user.email "223220792+beulahkemp@users.noreply.github.com"

      - name: Full clone of the data repo (seeding needs COMPLETE history)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "FATAL: GH_PAT secret not set"; exit 1
          fi
          export GIT_LFS_SKIP_SMUDGE=1
          git clone "https://beulahkemp:${GH_PAT}@github.com/beulahkemp/RH-workflow-data.git" /tmp/rh-data-seed
          echo "Cloned: $(git -C /tmp/rh-data-seed log --oneline -1) ($(du -sh /tmp/rh-data-seed/.git | cut -f1) .git)"

      - name: Seed (or re-seed) the blob store
        env:
          NETLIFY_PAT: ${{ secrets.NETLIFY_PAT }}
          NETLIFY_BLOB_SITE_ID: ${{ secrets.NETLIFY_BLOB_SITE_ID }}
        run: |
          RESEED_FLAG=""
          if [ "${{ inputs.reseed }}" = "true" ]; then RESEED_FLAG="--reseed"; fi
          python3 -m rh_catalog.cli blobs-sync --data-repo /tmp/rh-data-seed $RESEED_FLAG

      - name: Post-seed verification (restore the chain head)
        env:
          NETLIFY_PAT: ${{ secrets.NETLIFY_PAT }}
          NETLIFY_BLOB_SITE_ID: ${{ secrets.NETLIFY_BLOB_SITE_ID }}
        run: |
          # The seed is only proven when a FRESH restore reproduces the head
          # (sha-verified + final-head assert) — do not trust the upload alone.
          rm -rf /tmp/rh-data-seed
          python3 -m rh_catalog.cli blobs-restore --out /tmp/rh-data-verify --verify
          test "$(git -C /tmp/rh-data-verify rev-parse HEAD)" = \
            "$(python3 -c "import os,urllib.request,json; r=urllib.request.Request('https://api.netlify.com/api/v1/blobs/' + os.environ['NETLIFY_BLOB_SITE_ID'] + '/site:rh-backup/manifest.json'); r.add_header('Authorization','Bearer ' + os.environ['NETLIFY_PAT']); print(json.load(urllib.request.urlopen(r))['last_backed_up_sha'])")" \
            || { echo "FATAL: restored head != manifest last_backed_up_sha"; exit 1; }
          echo "Seed verified end-to-end (restore + fsck + head assert)"

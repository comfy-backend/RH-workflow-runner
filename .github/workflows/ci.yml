name: Remote CI

# Test-suite runs for the PRIVATE code repo (beulahkemp/RH-workflow), executed
# here because the beulahkemp account's Actions minutes are exhausted (issue
# #13) while this public runner has unlimited minutes.
#
# Triggered via `repository_dispatch` (type: code-push) — call it right after
# pushing to the code repo's main:
#
#   GH_PAT=... bash scripts/trigger_remote_ci.sh [sha]
#
# (the helper lives in the private code repo; it POSTs the dispatch with the
# pushed SHA). Manual dispatch also works for re-running a specific SHA.

on:
  repository_dispatch:
    types: [code-push]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Code-repo SHA to test (default: main HEAD)'
        required: false
        default: ''

concurrency:
  group: remote-ci
  cancel-in-progress: true

jobs:
  test:
    name: Test suite (private code repo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code repo (private, via PAT)
        uses: actions/checkout@v4
        with:
          repository: beulahkemp/RH-workflow
          ref: ${{ github.event.client_payload.sha || github.event.inputs.sha || 'main' }}
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Record code-repo SHA
        run: echo "CODE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python3 -m pytest tests/ -v --tb=short

      - name: Post result to code repo (on failure only)
        if: failure()
        env:
          CODE_SHA: ${{ env.CODE_SHA }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            // Commit statuses need a full SHA — use the checkout's actual HEAD
            // (the ref input was already resolved by actions/checkout). Env is
            // read via process.env (script-injection-safe pattern).
            const sha = process.env.CODE_SHA;
            if (!sha) {
              core.warning('CODE_SHA not set — skipping commit status.');
            } else {
              await github.rest.repos.createCommitStatus({
                owner: 'beulahkemp',
                repo: 'RH-workflow',
                sha,
                state: 'failure',
                context: 'remote-ci (comfy-backend runner)',
                description: 'Test suite failed',
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              }).catch(e => core.warning(`commit status failed: ${e.message}`));
            }
